# Merge into the target host's own OpenSSH configuration after replacing paths.
# Restrict the dedicated gateway OS user to this program and prohibit forwarding.
Subsystem iivirtualizer /opt/iivirtualizer/bin/iivirtualizer-gateway agent /etc/iivirtualizer/gateway-server.json
Match User virtualizer
    ForceCommand /opt/iivirtualizer/bin/iivirtualizer-gateway agent /etc/iivirtualizer/gateway-server.json
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
